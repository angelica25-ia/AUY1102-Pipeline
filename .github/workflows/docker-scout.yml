name: Docker Scout Analysis

on:
  pull_request:
    branches:
      - main

jobs:
  docker-scout:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and scan image with Docker Scout
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/pipeline-app:pr-${{ github.event.pull_request.number }} .
          docker scout cves ${{ secrets.DOCKERHUB_USERNAME }}/pipeline-app:pr-${{ github.event.pull_request.number }}
